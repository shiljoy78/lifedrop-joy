<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c62828">
<title>LifeDrop | রক্তদাতা খুঁজুন</title>
<style>
:root{--bg:#fff7f7;--card:#fff;--tx:#2a1717;--mu:#7a5a5a;--red:#c62828;--bd:#f0d3d3;--ok:#1b7a3a}
@media (prefers-color-scheme:dark){:root{--bg:#1c1212;--card:#2a1a1a;--tx:#f6e8e8;--mu:#c3a0a0;--red:#ef5350;--bd:#4a2c2c;--ok:#6fcf8a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Noto Sans Bengali",sans-serif;max-width:560px;margin:auto;padding:14px;padding-top:max(14px,env(safe-area-inset-top))}
h1{font-size:20px;margin:0}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
button,select,input{font:inherit;color:var(--tx)}
.sm{border:1px solid var(--bd);background:var(--card);border-radius:8px;padding:6px 10px;margin-left:4px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);margin-top:6px}
label{font-size:13px;color:var(--mu);display:block;margin-top:8px}
.btn{background:var(--red);color:#fff;border:0;border-radius:8px;padding:12px;width:100%;margin-top:12px;font-weight:600}
.btn.alt{background:transparent;color:var(--red);border:1px solid var(--red);margin-top:8px}
.d{display:flex;gap:12px;align-items:center}
.bg{min-width:52px;height:52px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.d small{color:var(--mu);display:block}.ok{color:var(--ok)!important}
a.call{margin-left:auto;text-decoration:none;background:var(--ok);color:#fff;border-radius:8px;padding:8px 12px;font-size:14px}
.msg{color:var(--mu);text-align:center;padding:16px}
#login{text-align:center;padding:40px 10px}#login p{color:var(--mu)}
</style></head><body>
<header><h1 id="t"></h1><div><button class="sm" id="lb"></button><button class="sm" id="out" hidden></button></div></header>
<div id="login" hidden><p id="lp"></p><button class="btn" id="gin"></button><div class="msg" id="le"></div></div>
<div id="app" hidden>
 <div class="card"><input id="fs" placeholder="🔍 রক্তের গ্রুপ লিখুন (যেমন B+) বা নাম/ফোন/এলাকা"></div>
<div class="card"><div class="row">
<div><label id="l_bg"></label><select id="fb"></select></div>
<div><label id="l_ar"></label><input id="fa" list="dl"></div></div></div>
<div id="list"></div>
<div class="card"><b id="ft"></b>
<label id="l_n"></label><input id="n" maxlength="60">
<label id="l_p"></label><input id="p" type="tel" inputmode="tel" maxlength="20">
<div class="row"><div><label id="l_b2"></label><select id="b"></select></div><div><label id="l_ag"></label><input id="ag" type="number" min="18" max="65"></div></div>
<label id="l_lc"></label><input id="lc" list="dl" maxlength="60">
<label id="l_ld"></label><input id="ld" type="date">
<button class="btn" id="save"></button><button class="btn alt" id="del" hidden></button>
<div class="msg" id="st"></div></div></div>
<datalist id="dl"></datalist>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import{getFirestore,collection,doc,setDoc,deleteDoc,onSnapshot}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const cfg={apiKey:"AIzaSyCKm0vq5e-UOrUHA-PNzcsmxVQaD7yxReo",authDomain:"lifedrop-joy.firebaseapp.com",projectId:"lifedrop-joy",storageBucket:"lifedrop-joy.firebasestorage.app",messagingSenderId:"38132386653",appId:"1:38132386653:web:1093f566fe7ce7866436b4"};
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
const G=["A+","A-","B+","B-","O+","O-","AB+","AB-"];
const DIST=["ঢাকা","গাজীপুর","নারায়ণগঞ্জ","টাঙ্গাইল","কিশোরগঞ্জ","মানিকগঞ্জ","মুন্সিগঞ্জ","নরসিংদী","ফরিদপুর","গোপালগঞ্জ","মাদারীপুর","রাজবাড়ী","শরীয়তপুর","চট্টগ্রাম","কক্সবাজার","কুমিল্লা","ফেনী","ব্রাহ্মণবাড়িয়া","চাঁদপুর","লক্ষ্মীপুর","নোয়াখালী","খাগড়াছড়ি","রাঙ্গামাটি","বান্দরবান","রাজশাহী","বগুড়া","জয়পুরহাট","নওগাঁ","নাটোর","চাঁপাইনবাবগঞ্জ","পাবনা","সিরাজগঞ্জ","খুলনা","বাগেরহাট","সাতক্ষীরা","যশোর","ঝিনাইদহ","মাগুরা","নড়াইল","কুষ্টিয়া","চুয়াডাঙ্গা","মেহেরপুর","বরিশাল","ভোলা","ঝালকাঠি","পটুয়াখালী","পিরোজপুর","বরগুনা","সিলেট","মৌলভীবাজার","হবিগঞ্জ","সুনামগঞ্জ","রংপুর","দিনাজপুর","গাইবান্ধা","কুড়িগ্রাম","লালমনিরহাট","নীলফামারী","পঞ্চগড়","ঠাকুরগাঁও","ময়মনসিংহ","জামালপুর","নেত্রকোনা","শেরপুর"];
const T={bn:{t:"🩸 LifeDrop",lb:"English",lp:"রক্তদাতা খুঁজতে ও নিজের তথ্য দিতে Google দিয়ে সাইন-ইন করুন",gin:"Google দিয়ে সাইন-ইন",out:"সাইন-আউট",bg:"রক্তের গ্রুপ",ar:"এলাকা / জেলা",all:"সব",ft:"দাতা হিসেবে যোগ করুন",n:"নাম",p:"ফোন নম্বর",b2:"রক্তের গ্রুপ",ag:"বয়স (১৮-৬৫)",lc:"লোকেশন (জেলা/এলাকা)",ld:"শেষ রক্ত দেওয়ার তারিখ",save:"সংরক্ষণ করুন",upd:"আমার তথ্য হালনাগাদ করুন",del:"আমার তথ্য মুছুন",none:"কোনো দাতা পাওয়া যায়নি",call:"কল",age:"বছর",ago:"দিন আগে",never:"আগে দেননি",rdy:"দিতে পারবেন",saved:"সংরক্ষিত হয়েছে ✓",err:"সমস্যা হয়েছে, আবার চেষ্টা করুন",fill:"নাম, ফোন ও রক্তের গ্রুপ দিন",ph:"ফোন নম্বর ঠিক নয়",agx:"বয়স ১৮-৬৫ হতে হবে"},
en:{t:"🩸 LifeDrop",lb:"বাংলা",lp:"Sign in with Google to find donors and add your info",gin:"Sign in with Google",out:"Sign out",bg:"Blood group",ar:"Area / District",all:"All",ft:"Add yourself as a donor",n:"Name",p:"Phone number",b2:"Blood group",ag:"Age (18-65)",lc:"Location (district/area)",ld:"Last donation date",save:"Save",upd:"Update my info",del:"Delete my info",none:"No donors found",call:"Call",age:"yrs",ago:"days ago",never:"Not donated yet",rdy:"Can donate",saved:"Saved ✓",err:"Something went wrong, try again",fill:"Enter name, phone and blood group",ph:"Invalid phone number",agx:"Age must be 18-65"}};
let L="bn",donors=[],me=null,unsub=null;
const $=id=>document.getElementById(id);
const dg=s=>s.replace(/[০-৯]/g,d=>"০১২৩৪৫৬৭৮৯".indexOf(d));
$("dl").innerHTML=DIST.map(d=>`<option value="${d}">`).join("");
const opts=(s,all)=>{s.innerHTML=(all?`<option value="">${T[L].all}</option>`:"")+G.map(g=>`<option>${g}</option>`).join("")};
function labels(){const s=T[L];document.documentElement.lang=L;
 for(const[k,v]of Object.entries({t:s.t,lb:s.lb,lp:s.lp,gin:s.gin,out:s.out,l_bg:s.bg,l_ar:s.ar,ft:s.ft,l_n:s.n,l_p:s.p,l_b2:s.b2,l_ag:s.ag,l_lc:s.lc,l_ld:s.ld,del:s.del}))$(k).textContent=v;
 const fv=$("fb").value,bv=$("b").value;opts($("fb"),1);opts($("b"));$("fb").value=fv;if(bv)$("b").value=bv;
 $("save").textContent=donors.some(d=>d.id===me)?s.upd:s.save;render()}
function render(){const s=T[L],g=$("fb").value,a=dg($("fa").value.trim().toLowerCase()),q=dg($("fs").value.trim().toLowerCase()),qg=q.replace(/\s/g,"").toUpperCase(),isG=/^(A|B|AB|O)[+-]?$/.test(qg);
const mt=d=>!q||(isG?(/[+-]$/.test(qg)?d.bg===qg:String(d.bg).replace(/[+-]/,"")===qg):[d.name,d.phone,d.loc].some(v=>dg(String(v||"").toLowerCase()).includes(q)));
const r=donors.filter(d=>mt(d)&&(!g||d.bg===g)&&(!a||dg(String(d.loc||"").toLowerCase()).includes(a))); 
 r.sort((x,y)=>String(x.last||"").localeCompare(String(y.last||"")));
 $("list").innerHTML=r.length?"":`<div class="msg">${s.none}</div>`;
 r.forEach(d=>{const el=document.createElement("div");el.className="card d";
  const days=d.last?Math.floor((Date.now()-new Date(d.last))/864e5):null;
  const ok=days===null||days>=120,st=days===null?s.never:days+" "+s.ago;
  const b=document.createElement("div");b.className="bg";b.textContent=d.bg;
  const m=document.createElement("div"),nm=document.createElement("b");nm.textContent=d.name;
  const l1=document.createElement("small");l1.textContent=`${d.loc||""} · ${d.age||"?"} ${s.age}`;
  const l2=document.createElement("small");l2.className=ok?"ok":"";l2.textContent=st+(ok?" · "+s.rdy:"");
  m.append(nm,l1,l2);const c=document.createElement("a");c.className="call";c.textContent="📞 "+s.call;
  c.href="tel:"+String(d.phone).replace(/[^0-9+]/g,"");el.append(b,m,c);$("list").append(el)})}
onAuthStateChanged(auth,u=>{
 if(unsub){unsub();unsub=null}
 $("login").hidden=!!u;$("app").hidden=!u;$("out").hidden=!u;
 if(!u){me=null;donors=[];labels();return}
 me=u.uid;
 unsub=onSnapshot(collection(db,"donors"),snap=>{donors=snap.docs.map(x=>({id:x.id,...x.data()}));
  const mine=donors.find(d=>d.id===me);
  if(mine&&!$("n").value){$("n").value=mine.name||"";$("p").value=mine.phone||"";$("b").value=mine.bg||"A+";$("ag").value=mine.age||"";$("lc").value=mine.loc||"";$("ld").value=mine.last||""}
  $("del").hidden=!mine;labels()},()=>{$("st").textContent=T[L].err})});
$("gin").onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){$("le").textContent=T[L].err+" ("+(e.code||"")+")"}};
$("out").onclick=()=>signOut(auth);
$("save").onclick=async()=>{const s=T[L];if(!me)return;
 const n=$("n").value.trim(),p=dg($("p").value.trim()),b=$("b").value,ag=+dg($("ag").value);
 if(!n||!p||!b){$("st").textContent=s.fill;return}
 if(!/^\+?[0-9]{10,14}$/.test(p.replace(/[\s-]/g,""))){$("st").textContent=s.ph;return}
 if(!(ag>=18&&ag<=65)){$("st").textContent=s.agx;return}
 try{await setDoc(doc(db,"donors",me),{name:n,phone:p,bg:b,age:ag,loc:$("lc").value.trim(),last:$("ld").value||null});$("st").textContent=s.saved}catch(e){$("st").textContent=s.err}};
$("del").onclick=async()=>{try{await deleteDoc(doc(db,"donors",me));["n","p","ag","lc","ld"].forEach(i=>$(i).value="");$("st").textContent=""}catch(e){$("st").textContent=T[L].err}};
$("lb").onclick=()=>{L=L==="bn"?"en":"bn";$("st").textContent="";labels()};
$("fb").onchange=render;$("fa").oninput=render;$("fs").oninput=render;
</script></body></html>
